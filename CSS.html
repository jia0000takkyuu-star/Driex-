<style>

/* ==========================
   DriveX Login CSS
   ========================== */


/* 全体 */
body {

  margin: 0;

  padding: 0;

  height: 100vh;

  background: #f3f4f6;

  font-family:
    "Noto Sans JP",
    Arial,
    sans-serif;

}


/* 中央配置 */
.login-wrapper {

  width: 100%;

  height: 100vh;

  display: flex;

  justify-content: center;

  align-items: center;

}


/* ログインカード */
.login-card {

  width: 360px;

  background: white;

  padding: 40px;

  border-radius: 16px;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.12);

  text-align: center;

}


/* ロゴ */
.logo {

  font-size: 36px;

  font-weight: bold;

  color: #2563eb;

  margin-bottom: 8px;

}


/* サブタイトル */
.subtitle {

  color: #666;

  font-size: 14px;

  margin-bottom: 30px;

}



/* 入力エリア */
.form-group {

  text-align: left;

  margin-bottom: 18px;

}


.form-group label {

  display: block;

  font-size: 14px;

  margin-bottom: 6px;

  color: #333;

}



.form-group input {


  width: 100%;

  box-sizing: border-box;

  padding: 12px;

  border:

    1px solid #ddd;

  border-radius: 8px;

  font-size: 15px;


}


.form-group input:focus {

  outline: none;

  border-color: #2563eb;

}


/* ログインボタン */
#loginBtn {


  width: 100%;

  padding: 13px;

  margin-top: 10px;

  border: none;

  border-radius: 8px;

  background: #2563eb;

  color: white;

  font-size: 16px;

  cursor: pointer;


}



#loginBtn:hover {

  opacity: 0.9;

}


#loginBtn:disabled {

  background: #94a3b8;

  cursor: not-allowed;

}



/* メッセージ */
.message {

  margin-top: 15px;

  font-size: 14px;

  color: #dc2626;

}



/* バージョン */
.version {

  margin-top: 25px;

  color: #999;

  font-size: 12px;

}


/* スマホ対応 */
@media(max-width:480px){


  .login-card {

    width: 85%;

    padding: 30px;

  }


}


</style>
