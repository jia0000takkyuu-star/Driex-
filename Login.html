<!DOCTYPE html>
<html>

<head>

<base target="_top">

<?!= include("CSS"); ?>


<style>


body{

margin:0;

background:#f3f4f6;

font-family:
"Noto Sans JP",
Arial,
sans-serif;

}



.login-wrapper{

height:100vh;

display:flex;

align-items:center;

justify-content:center;

}



.login-card{

background:white;

width:360px;

padding:40px;

border-radius:16px;

box-shadow:
0 10px 30px rgba(0,0,0,0.15);

text-align:center;

}



.logo{

font-size:36px;

font-weight:bold;

color:#2563eb;

}



.subtitle{

margin-bottom:30px;

color:#666;

}



.form-group{

text-align:left;

margin-bottom:18px;

}



.form-group label{

display:block;

margin-bottom:6px;

}



.form-group input{


width:100%;

box-sizing:border-box;

padding:12px;

border:1px solid #ddd;

border-radius:8px;

font-size:15px;


}



#loginBtn{


width:100%;

padding:13px;

background:#2563eb;

color:white;

border:none;

border-radius:8px;

font-size:16px;

cursor:pointer;


}



#loginBtn:disabled{

background:#999;

}



.message{

margin-top:15px;

font-size:14px;

}



.version{

margin-top:20px;

color:#999;

font-size:12px;

}


</style>


</head>


<body>



<div class="login-wrapper">


<div class="login-card">


<div class="logo">

DriveX

</div>



<div class="subtitle">

File Management System

</div>



<div class="form-group">


<label>

ユーザーID

</label>


<input

id="userId"

type="text"

placeholder="ユーザーID">


</div>



<div class="form-group">


<label>

パスワード

</label>


<input

id="password"

type="password"

placeholder="パスワード">


</div>



<button

id="loginBtn"

onclick="login()">

ログイン

</button>



<div

id="message"

class="message">

</div>



<div class="version">

Version 1.0

</div>



</div>


</div>
<script>


function login(){



const id =

document
.getElementById("userId")
.value;



const pass =

document
.getElementById("password")
.value;



const btn =

document
.getElementById("loginBtn");



const msg =

document
.getElementById("message");





if(
!id ||
!pass
){


msg.style.color =
"red";


msg.innerText =
"IDとパスワードを入力してください";


return;


}





btn.disabled =
true;


btn.innerText =
"ログイン中...";





google.script.run



.withSuccessHandler(
function(result){



if(
result &&
result.success
){



msg.style.color =
"green";


msg.innerText =
"ログイン成功";





/*
ログイン情報保存
*/

sessionStorage.setItem(

"user",

JSON.stringify(result)

);







/*
Dashboardへ移動
*/


setTimeout(
function(){



google.script.run



.withSuccessHandler(
function(url){



window.top.location.href =

url + "?page=Dashboard";



}

)



.withFailureHandler(
function(error){



console.error(error);



msg.style.color =
"red";


msg.innerText =
"ページ移動エラー";



btn.disabled =
false;


btn.innerText =
"ログイン";



}

)



.getWebAppUrl();




},
500
);





}else{



msg.style.color =
"red";


msg.innerText =

result.message;



btn.disabled =
false;


btn.innerText =
"ログイン";



}



}

)




.withFailureHandler(
function(error){



console.error(error);



msg.style.color =
"red";


msg.innerText =

"通信エラー";



btn.disabled =
false;


btn.innerText =
"ログイン";



}

)



.login(
id,
pass
);



}


</script>


</body>

</html>
